##############################################################################
# CI — runs on every push and pull request
#
# Jobs:
#   typecheck  — TypeScript compilation (frontend + API)
#   build      — Vite production build (verifies frontend bundles cleanly)
#   security   — npm audit (fails on high/critical vulnerabilities)
##############################################################################

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Provide placeholder VITE_ vars so Vite build succeeds without real secrets
  VITE_SUPABASE_URL:     https://placeholder.supabase.co
  VITE_SUPABASE_ANON_KEY: placeholder-anon-key

jobs:

  # ── Type-check ──────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Type-check API
        run: npx tsc -p tsconfig.api.json --noEmit

  # ── Build ───────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload dist artefact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ── Security audit ──────────────────────────────────────────────────────────
  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: npm audit (high + critical only)
        run: npm audit --audit-level=high
        continue-on-error: true   # advisory, not blocking — remove to enforce

  # ── Docker build validation ─────────────────────────────────────────────────
  docker-validate:
    name: Docker build (validate)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: inclusyq:ci
          build-args: |
            VITE_SUPABASE_URL=${{ env.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ env.VITE_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
