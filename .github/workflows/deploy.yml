##############################################################################
# Deploy — runs on push to main (after CI passes)
#
# Steps:
#   1. Build and push Docker image to GitHub Container Registry (ghcr.io)
#   2. Deploy to Railway (primary recommendation) — OR swap for Fly.io / VPS
#
# Required repository secrets:
#   RAILWAY_TOKEN               — Railway API token  (for Railway deploy)
#   VITE_SUPABASE_URL           — baked into frontend bundle at build time
#   VITE_SUPABASE_ANON_KEY      — baked into frontend bundle at build time
#
# All runtime secrets (SUPABASE_SERVICE_ROLE_KEY, JWT_*, REDIS_URL, etc.)
# are set in the Railway / hosting environment — NOT stored in GitHub Secrets.
##############################################################################

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:             # allow manual trigger

concurrency:
  group: deploy-production
  cancel-in-progress: false      # never cancel an in-flight production deploy

permissions:
  contents: read
  packages: write                # needed to push to ghcr.io

env:
  NODE_VERSION: "22"
  REGISTRY:     ghcr.io
  IMAGE_NAME:   ${{ github.repository }}

jobs:

  # ── Build & push Docker image ───────────────────────────────────────────────
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}    # automatic — no secret needed

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          provenance: true        # SLSA Level 2 provenance attestation
          sbom: true              # Software Bill of Materials

  # ── Deploy to Railway ───────────────────────────────────────────────────────
  deploy-railway:
    name: Deploy → Railway
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Deploy to Railway
        id: deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --service inclusyq \
            --environment production \
            --detach

      # ── Post-deploy health check ─────────────────────────────────────────
      - name: Wait for service to become healthy
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          echo "Waiting for /api/ready..."
          for i in $(seq 1 12); do
            status=$(curl -sf "$APP_URL/api/ready" | python3 -c "import sys,json; d=json.load(sys.stdin); print('ok' if d.get('ready') else 'fail')" 2>/dev/null || echo "fail")
            if [ "$status" = "ok" ]; then
              echo "✓ Service is ready"
              exit 0
            fi
            echo "  Attempt $i/12 — not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "✗ Service failed to become ready after 2 minutes"
          exit 1

  # ── Notify on failure ───────────────────────────────────────────────────────
  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-railway]
    if: failure()
    steps:
      - name: Post Slack alert
        if: ${{ secrets.SLACK_DLQ_WEBHOOK != '' }}
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ InclusyQ deploy failed on `${{ github.ref_name }}` — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DLQ_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
