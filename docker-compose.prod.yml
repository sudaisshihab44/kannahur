##############################################################################
# InclusyQ — Production Override
#
# Uses an external managed Redis (Upstash / Redis Cloud / AWS ElastiCache).
# Grafana and Prometheus are omitted — use a hosted observability platform
# (Grafana Cloud, Datadog, etc.) in production.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
##############################################################################

services:

  app:
    image: ghcr.io/${GITHUB_REPOSITORY:-your-org/inclusyq}:${IMAGE_TAG:-latest}
    # Override the build block — use the pre-built image from the registry
    build: !reset null
    restart: always
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first          # zero-downtime rolling update
        failure_action: rollback
      rollback_config:
        parallelism: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    environment:
      NODE_ENV:   production
      # REDIS_URL comes from the host environment (secrets manager)
      # PORT defaults to 3000 inside the container
    # Remove the local env_file — secrets injected via CI/CD or runtime secret manager
    env_file: !reset []
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Disable Redis container — use external managed Redis in prod
  redis: !reset null

  # Disable Prometheus container — use hosted scraper in prod (Grafana Cloud, etc.)
  prometheus: !reset null

  # Disable Grafana container
  grafana: !reset null

  # ── Nginx reverse proxy ───────────────────────────────────────────────────
  # Terminates TLS, serves static assets from dist/ via CDN edge,
  # and proxies /api/* to the app container.
  nginx:
    image: nginx:1.27-alpine
    container_name: inclusyq-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro   # certbot certs
      - certbot_www:/var/www/certbot
    depends_on:
      - app
    networks:
      - inclusyq

volumes:
  certbot_www:
