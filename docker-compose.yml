##############################################################################
# InclusyQ — Local Development / Full Stack
#
# Services:
#   app         Node.js API + React frontend (hot-reload via tsx)
#   redis       Redis 7 (BullMQ + caching)
#   prometheus  Metrics scraper
#   grafana     Dashboard UI  →  http://localhost:3001  (creds from GRAFANA_ADMIN_* env)
#
# Usage:
#   docker compose up                # start everything
#   docker compose up app redis      # start only app + redis (no monitoring)
#   docker compose down -v           # stop and wipe volumes
##############################################################################

services:

  # ── Application ─────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL:    ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    image: inclusyq:local
    container_name: inclusyq-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV:  production
      PORT:      3000
      REDIS_URL: redis://redis:6379
      # Bearer token for GET /api/metrics. Blank = open (dev only).
      # Production MUST set METRICS_TOKEN (see .env.example).
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/live"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 60s
    networks:
      - inclusyq

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: inclusyq-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5
    networks:
      - inclusyq

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: inclusyq-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
      # Uncomment when METRICS_TOKEN is set on app (see prometheus.yml):
      # - ./monitoring/.metrics_token:/etc/prometheus/metrics_token:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      # NOTE: --web.enable-lifecycle / --web.enable-admin-api intentionally
      # removed (SQ-MAJ-005) — they expose /-/quit and the admin API.
    networks:
      - inclusyq

  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: inclusyq-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      # SQ-MAJ-005: no default creds — compose fails fast with a clear message
      # if these are unset. Set via shell env or a gitignored .env file.
      GF_SECURITY_ADMIN_USER:          ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER (see .env.example)}
      GF_SECURITY_ADMIN_PASSWORD:      ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD (see .env.example)}
      GF_USERS_ALLOW_SIGN_UP:          "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/inclusyq.json
      GF_AUTH_ANONYMOUS_ENABLED:       "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/inclusyq.json:ro
      - ./monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - inclusyq

volumes:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  inclusyq:
    driver: bridge
