##############################################################################
# Prometheus scrape configuration for InclusyQ
#
# Scrapes:
#   - InclusyQ API metrics at /api/metrics
#   - Redis exporter (optional — add if using redis_exporter sidecar)
#   - Node Exporter (optional — add for host-level CPU/disk/network)
##############################################################################

global:
  scrape_interval:     15s   # How frequently to scrape targets
  evaluation_interval: 15s   # How frequently to evaluate rules
  scrape_timeout:      10s

  external_labels:
    environment: 'local'
    service:     'inclusyq'

# ── Alert rules ───────────────────────────────────────────────────────────────
# rule_files:
#   - /etc/prometheus/rules/*.yml

# ── Scrape targets ────────────────────────────────────────────────────────────
scrape_configs:

  # Inclusyq API — /api/metrics requires a bearer token when the app
  # has METRICS_TOKEN set (mandatory in prod). Setup:
  #   1. printf '%s' "$METRICS_TOKEN" > monitoring/.metrics_token && chmod 600 monitoring/.metrics_token
  #      (.metrics_token is gitignored — never commit the real token)
  #   2. Uncomment bearer_token_file below + the .metrics_token volume in docker-compose.yml
  - job_name: 'inclusyq-api'
    metrics_path: /api/metrics
    # bearer_token_file: '/etc/prometheus/metrics_token'
    static_configs:
      - targets: ['app:3000']
        labels:
          service: 'inclusyq-api'

  # Redis (requires redis_exporter sidecar — optional)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
